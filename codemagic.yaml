# Codemagic CI/CD for Denis iPad M1 Thin Client
# Free tier: 500 macOS minutes/month
# https://codemagic.io

workflows:
  denis-ipad-ipa:
    name: Build Denis iPad IPA
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      node: 20.11.0
      xcode: latest
      groups:
        - denis_ipad
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        working_directory: apps/ipad-thin-client
        script: npm install
      - name: Build web assets
        working_directory: apps/ipad-thin-client
        script: npx vite build
      - name: Capacitor setup iOS
        working_directory: apps/ipad-thin-client
        script: |
          cp ios/App/App/Info.plist /tmp/Info.plist.bak 2>/dev/null || true
          rm -rf ios
          npx cap add ios
          cp /tmp/Info.plist.bak ios/App/App/Info.plist 2>/dev/null || true
      - name: Build unsigned IPA
        working_directory: apps/ipad-thin-client
        script: |
          cd ios/App
          rm -rf build
          xcodebuild \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=so.denis.voice.client \
            ONLY_ACTIVE_ARCH=NO \
            -destination 'generic/platform=iOS'
          # Show what was built
          echo "=== Build output tree ==="
          find build -name "*.app" -type d 2>/dev/null
          find build -maxdepth 5 -type d 2>/dev/null | sort
          # Try to package
          APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            APP_DIR=$(dirname "$APP")
            cd "$APP_DIR"
            mkdir -p Payload
            cp -r "$(basename "$APP")" Payload/
            zip -r /tmp/DenisVoice.ipa Payload
            echo "IPA created: $(ls -la /tmp/DenisVoice.ipa)"
          else
            echo "WARNING: no .app found, checking archive..."
            find build -name "*.xcarchive" -type d 2>/dev/null
          fi
    artifacts:
      - /tmp/DenisVoice.ipa
    publishing:
      email:
        recipients:
          - alecbcn@icloud.com