# Codemagic CI/CD for Denis iPad M1 Thin Client
# Free tier: 500 macOS minutes/month
# https://codemagic.io

workflows:
  denis-ipad-ipa:
    name: Build Denis iPad IPA
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      node: 20.11.0
      xcode: latest
      groups:
        - denis_ipad
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        working_directory: apps/ipad-thin-client
        script: npm install
      - name: Build web assets
        working_directory: apps/ipad-thin-client
        script: npx vite build
      - name: Capacitor setup iOS
        working_directory: apps/ipad-thin-client
        script: |
          rm -rf ios/App/App.xcodeproj ios/App/App.xcworkspace 2>/dev/null
          npx cap add ios 2>/dev/null || npx cap sync ios
      - name: Pod install
        working_directory: apps/ipad-thin-client/ios/App
        script: pod install || true
      - name: Build unsigned IPA
        working_directory: apps/ipad-thin-client/ios/App
        script: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=so.denis.voice.client
      - name: Package IPA
        working_directory: apps/ipad-thin-client/ios/App
        script: |
          cd build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r ../../../../DenisVoice.ipa Payload
    artifacts:
      - apps/ipad-thin-client/DenisVoice.ipa
    publishing:
      email:
        recipients:
          - alecbcn@icloud.com